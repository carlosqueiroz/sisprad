services:
  mariadb:
    image: mariadb:10.11
    container_name: sisprad-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: default
    ports:
      - "3306:3306"
    volumes:
      - sisprad-db:/var/lib/mysql
      - ./backup.sql:/docker-entrypoint-initdb.d/00-backup.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  app:
    image: php:8.2-cli
    container_name: sisprad-app
    working_dir: /var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_DATABASE: default
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8088:8000"
    volumes:
      - ./:/var/www/html
    command: >
      bash -c "
      apt-get update -qq &&
      apt-get install -y -qq libzip-dev libpng-dev libjpeg-dev libfreetype6-dev libonig-dev libxml2-dev unzip git default-mysql-client &&
      docker-php-ext-configure gd --with-freetype --with-jpeg &&
      docker-php-ext-install -j$$(nproc) pdo_mysql mbstring zip exif pcntl bcmath gd >/dev/null &&
      curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
      tail -f /dev/null
      "

volumes:
  sisprad-db:
